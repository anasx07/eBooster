name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build eBooster (Windows MSVC Standalone)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild and Visual Studio Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Standalone, Portable & Setup Installer
        shell: powershell
        run: |
          $versionTag = "${{ github.ref_name }}"
          Write-Host "Building eBooster Release packages for: $versionTag" -ForegroundColor Cyan
          
          # Ensure Inno Setup is on PATH
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          }
          
          # Execute the release build script (MSVC standalone /MT + Inno Setup)
          powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1 -Version "$versionTag" -SkipMinGW
          
          $distExe = "dist\eBooster.exe"
          $distPortable = "dist\eBooster-Portable.exe"
          $distSetup = "dist\eBooster-Setup.exe"
          $distChecksums = "dist\checksums.txt"
          
          if (-not (Test-Path $distExe)) { throw "Executable was not produced at: $distExe" }
          if (-not (Test-Path $distPortable)) { throw "Portable executable was not produced at: $distPortable" }
          if (-not (Test-Path $distSetup)) { throw "Setup installer was not produced at: $distSetup" }
          if (-not (Test-Path $distChecksums)) { throw "Checksums file was not produced at: $distChecksums" }
          
          Write-Host "`nGenerated Release Artifacts in dist/:" -ForegroundColor Green
          Get-ChildItem -Path dist\ | Format-Table Name, Length, LastWriteTime

          # Generate structured release notes
          $setupHash = (Get-FileHash $distSetup -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $distPortable -Algorithm SHA256).Hash.ToLower()
          
          $releaseNotes = @"
          ## ⚡ eBooster Pro $versionTag

          ### 📦 Which file should I download?
          - 📦 **eBooster-Setup.exe** (*Recommended*): Complete Windows Installer with Start Menu & Desktop shortcuts.
          - 🚀 **eBooster-Portable.exe**: Single standalone executable for USB sticks or zero-install usage.

          ---

          ### 🛡️ Verified SHA-256 Hashes
          ```
          $setupHash  eBooster-Setup.exe
          $portableHash  eBooster-Portable.exe
          ```

          ---

          ### 🔒 Anti-Cheat & System Safety
          - **100% Anti-Cheat Compliant**: Operates purely at the Windows Filtering Platform (WFP) network layer.
          - **Zero DLL Injection**: Never accesses game memory, injects code, or modifies game binaries.
          "@
          Set-Content -Path dist\release_notes.md -Value $releaseNotes -Encoding UTF8

      - name: Sign Binaries (Windows Authenticode / SmartScreen)
        shell: powershell
        env:
          CERT_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "ℹ️ No code signing certificate secret (CERTIFICATE_BASE64) detected. Skipping Authenticode signing." -ForegroundColor Yellow
            return
          }

          Write-Host "🔐 Found code signing secret! Preparing certificate..." -ForegroundColor Cyan
          $certBytes = [System.Convert]::FromBase64String($env:CERT_BASE64)
          $certTemp = Join-Path $env:RUNNER_TEMP "cert_$([System.Guid]::NewGuid().ToString('N')).pfx"
          [System.IO.File]::WriteAllBytes($certTemp, $certBytes)

          try {
            $signtoolItem = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1
            if (-not $signtoolItem) { throw "signtool.exe not found in Windows Kits." }
            $signtool = $signtoolItem.FullName
            
            Write-Host "Signing eBooster-Setup.exe and eBooster-Portable.exe using $signtool..." -ForegroundColor Cyan
            & $signtool sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certTemp /p $env:CERT_PASS "dist\eBooster-Setup.exe" "dist\eBooster-Portable.exe"
            
            # Recalculate checksums with newly signed hashes
            $setupHash = (Get-FileHash dist\eBooster-Setup.exe -Algorithm SHA256).Hash.ToLower()
            $portableHash = (Get-FileHash dist\eBooster-Portable.exe -Algorithm SHA256).Hash.ToLower()
            $newChecksums = "$setupHash  eBooster-Setup.exe`r`n$portableHash  eBooster-Portable.exe`r`n"
            Set-Content -Path dist\checksums.txt -Value $newChecksums -Encoding ASCII
            Write-Host "✓ Successfully signed binaries and updated checksums.txt!" -ForegroundColor Green
          } finally {
            if (Test-Path $certTemp) { Remove-Item $certTemp -Force -ErrorAction SilentlyContinue }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eBooster Pro ${{ github.ref_name }}
          body_path: dist/release_notes.md
          generate_release_notes: true
          files: |
            dist/eBooster-Setup.exe
            dist/eBooster-Portable.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Windows Package Manager (Winget)
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: anasx07.eBooster
          installers-regex: 'eBooster-Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
