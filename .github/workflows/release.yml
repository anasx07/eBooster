name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build eBooster (Windows MSVC Standalone)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild and Visual Studio Tools
        uses: microsoft/setup-msbuild@v2

      - name: Build Standalone Executable
        shell: powershell
        run: |
          $versionTag = "${{ github.ref_name }}"
          Write-Host "Building standalone eBooster.exe for: $versionTag" -ForegroundColor Cyan
          
          # Execute the standalone release build script (MSVC standalone /MT)
          powershell -ExecutionPolicy Bypass -File scripts\build_release.ps1 -Version "$versionTag" -SkipMinGW
          
          $distExe = "dist\eBooster.exe"
          if (-not (Test-Path $distExe)) {
            throw "Executable was not produced at: $distExe"
          }
          
          # Compute and display SHA256 hash
          $exeHash = (Get-FileHash -Path $distExe -Algorithm SHA256).Hash
          Write-Host "eBooster.exe SHA256: $exeHash" -ForegroundColor Green

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eBooster Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/eBooster.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
